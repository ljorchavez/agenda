name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile committed yet: once pnpm-lock.yaml exists, add `cache: pnpm` above and --frozen-lockfile here.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://agenda:agenda@localhost:5432/agenda_test
      - run: pnpm --filter @agenda/web build
